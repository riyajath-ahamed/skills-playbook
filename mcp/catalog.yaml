    setup_guide: setup-guides/confluence.md
    configuration:
      - name: CONFLUENCE_BASE_URL
        secret: false
        required: true
        source: environment
      - name: CONFLUENCE_EMAIL
        secret: false
        required: true
        source: environment
      - name: CONFLUENCE_API_TOKEN
        secret: true
        required: true
        source: environment-or-secret-store
    capabilities:
      - id: read_page
        access: read
    authentication:
      methods:
        - api_token
    permission_profile: read-only
    environments:
      allowed:
        - development
      production: deny
    risk: medium
    approval:
      reads: false
      writes: true
      production: true
    health_check:
      supported: false
      method: python scripts/mcpctl.py doctor reports confluence-mcp. This repository does not call Confluence during validation.
    last_verified: "2026-10-31"

  - id: sonarqube
    name: SonarQube
    purpose: Read a quality gate and unresolved issues through the local sonar-mcp connector. The token is optional.
    status: documented
    installed: false
    provider: SonarSource
    transport: stdio
    package: mcp-servers/sonar/server.py
    documentation: https://docs.sonarsource.com/sonarqube-server/latest/extension-guide/web-api/
    setup_guide: setup-guides/sonarqube.md
    configuration:
      - name: SONARQUBE_TOKEN
        secret: true
        required: false
        source: environment-or-secret-store
      - name: SONARQUBE_URL
        secret: false
        required: false
        source: environment
      - name: SONARQUBE_ORG
        secret: false
        required: false
        source: environment
    capabilities:
      - id: read_findings
        access: read
    authentication:
      methods:
        - oauth
        - user_token
    permission_profile: read-only
    environments:
      allowed:
        - development
      production: deny
    risk: high
    approval:
      reads: true
      writes: true
      production: true
    health_check:
      supported: false
      method: python scripts/mcpctl.py doctor reports sonar-mcp. A missing token is optional. This repository does not call SonarQube during validation.
    last_verified: "2026-10-31"

  - id: kubernetes-diagnostics
    name: Amazon EKS diagnostics
    purpose: Inspect an Amazon EKS cluster. This entry is not a generic Kubernetes client for arbitrary clusters.
    status: documented
    installed: false
    provider: awslabs/mcp
    transport: stdio
    package: awslabs.eks-mcp-server
    documentation: https://github.com/awslabs/mcp/blob/main/src/eks-mcp-server/README.md
    setup_guide: setup-guides/kubernetes.md
    configuration:
      - name: AWS_PROFILE
        secret: false
        required: false
        source: environment
      - name: AWS_REGION
        secret: false
        required: false
        source: environment
    capabilities:
      - id: read_cluster
        access: read
      - id: write_cluster
        access: write
    authentication:
      methods:
        - aws_credentials
        - kubeconfig
    permission_profile: read-only
    environments:
      allowed:
        - development
      production: deny
    risk: critical
    approval:
      reads: true
      writes: true
      production: true
    health_check:
      supported: false
      method: Confirm the client lists the server after uvx starts it. This repository does not contact a cluster.
    last_verified: "2026-10-30"


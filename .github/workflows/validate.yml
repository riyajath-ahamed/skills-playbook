name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r mcp-servers/requirements.txt

      - name: Validate, calibrate rubrics, and run Python and Go tests
        run: bash scripts/test-all.sh

      - name: Build the CLI
        working-directory: platform
        run: go build -o "${{ runner.temp }}/ei" ./cmd/ei
